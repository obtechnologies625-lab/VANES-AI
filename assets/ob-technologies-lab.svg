<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="oblT oblD">
<title id="oblT">OB Tech-Labs logo</title>
<desc id="oblD">A segmented hexagon mark, half cyan and half magenta, beside the OB TECH-LABS wordmark and the tagline Innovate, Build, Impact.</desc>
<defs>
  <radialGradient id="oblBg" cx=".5" cy=".4" r=".9"><stop stop-color="#101a3a"/><stop offset=".7" stop-color="#050916"/><stop offset="1" stop-color="#02040c"/></radialGradient>
  <linearGradient id="oblCyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ff6ff"/><stop offset=".5" stop-color="#22d9ff"/><stop offset="1" stop-color="#00b3e6"/></linearGradient>
  <linearGradient id="oblMag" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f58bff"/><stop offset=".5" stop-color="#e04cff"/><stop offset="1" stop-color="#c81ee0"/></linearGradient>
  <linearGradient id="oblRule" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d9ff"/><stop offset=".5" stop-color="#7b55ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
  <filter id="oblGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="760" height="200" rx="34" fill="url(#oblBg)"/>
<g transform="translate(112 100)" filter="url(#oblGlow)">
  <g stroke-linecap="butt" fill="none" stroke-width="13">
    <path d="M6.44-58.28 47.26-34.72" stroke="url(#oblMag)"/>
    <path d="M53.7-23.56V23.56" stroke="url(#oblMag)"/>
    <path d="M47.26 34.72 6.44 58.28" stroke="url(#oblMag)"/>
    <path d="M-6.44 58.28-47.26 34.72" stroke="url(#oblCyan)"/>
    <path d="M-53.7 23.56V-23.56" stroke="url(#oblCyan)"/>
    <path d="M-47.26-34.72-6.44-58.28" stroke="url(#oblCyan)"/>
  </g>
  <g fill="none" stroke-width="7">
    <path d="M0-30-26-15V15L0 30" stroke="url(#oblCyan)"/>
    <path d="M0-30 26-15V15L0 30" stroke="url(#oblMag)"/>
  </g>
</g>
<g font-family="'Segoe UI',Roboto,Arial,sans-serif">
  <text x="212" y="98" font-size="54" font-weight="900" letter-spacing="7" fill="#f3fbff"><tspan fill="#22d9ff">OB</tspan> TECH-LABS</text>
  <g>
    <rect x="214" y="116" width="238" height="3" fill="url(#oblRule)"/>
    <rect x="462" y="112.5" width="10" height="10" transform="rotate(45 467 117.5)" fill="#ff2bd6"/>
    <rect x="482" y="116" width="238" height="3" fill="url(#oblRule)"/>
  </g>
  <text x="216" y="156" font-size="21" font-weight="700" letter-spacing="9" fill="#cfe3f2">INNOVATE <tspan fill="#ff2bd6">•</tspan> BUILD <tspan fill="#ff2bd6">•</tspan> IMPACT</text>
</g>
</svg>
