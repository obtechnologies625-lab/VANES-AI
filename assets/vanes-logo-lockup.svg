<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="vlT vlD">
<title id="vlT">VANES AI logo</title>
<desc id="vlD">The VANES AI six turbine wheel beside the VANES AI wordmark and the line Versatile Adaptive Neuro Emergent System.</desc>
<defs>
  <radialGradient id="vlBg" cx=".5" cy=".42" r=".9"><stop stop-color="#101a3a"/><stop offset=".7" stop-color="#050916"/><stop offset="1" stop-color="#02040c"/></radialGradient>
  <linearGradient id="vlN" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaffff"/><stop offset=".28" stop-color="#27e9ff"/><stop offset=".66" stop-color="#7654ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
  <linearGradient id="vlRule" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#27e9ff"/><stop offset=".5" stop-color="#7654ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
  <filter id="vlG" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="760" height="200" rx="34" fill="url(#vlBg)"/>
